<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentis 品牌审计报告</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --dr-primary: #13BE93;
  --dr-primary-deep: #0F766E;
  --dr-primary-light: #f5fafa;
  --dr-primary-border: #99f6e4;
  --dr-brand-grad: linear-gradient(90deg, #13BE93 0%, #2DB1BD 100%);
  --dr-success: #047857;
  --dr-success-light: #f0fdf4;
  --dr-success-border: #a7f3d0;
  --dr-warning: #B45309;
  --dr-warning-light: #fffbeb;
  --dr-warning-border: #fde68a;
  --dr-danger: #B91C1C;
  --dr-danger-light: #fef2f2;
  --dr-danger-border: #fecaca;
  --dr-info: #1D4ED8;
  --dr-info-light: #eff6ff;
  --dr-info-border: #bfdbfe;
  --dr-purple: #6D28D9;
  --dr-purple-light: #f5f3ff;
  --dr-sky: #0ea5e9;
  --dr-sky-light: #f0f9ff;
  --dr-bg-page: #FFFFFF;
  --dr-bg-card: #fff;
  --dr-bg-subtle: #f5fafa;
  --dr-border: #eef2f3;
  --dr-border-light: #e8edf8;
  --dr-border-subtle: #f1f5f9;
  --dr-text-primary: #0E2A33;
  --dr-text-secondary: #334155;
  --dr-text-muted: #475569;
  --dr-text-tertiary: #64748b;
  --dr-text-placeholder: #94a3b8;
  --dr-text-disabled: #cbd5e1;
  --dr-orange: #C2410C;
  --dr-orange-light: #fff7ed;
  --dr-bg-bar-track: #e2e8f0;
  --dr-purple-border: #ddd6fe;
  --dr-sky-border: #bae6fd;
  --dr-radius-xs: 4px;
  --dr-radius-sm: 6px;
  --dr-radius-md: 8px;
  --dr-radius-lg: 10px;
  --dr-radius-xl: 14px;
  --dr-radius-2xl: 16px;
}

/* ===== Reset & Base ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--dr-bg-page);
  color: var(--dr-text-secondary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}
:focus-visible {
  outline: 2px solid var(--dr-primary);
  outline-offset: 2px;
}

/* ===== Page Layout ===== */
.dr-page {
  min-height: 100vh;
  padding: 0 0 48px;
  background: var(--dr-bg-page);
}
.dr-content {
  width: min(1080px, calc(100% - 64px));
  padding-top: 28px;
  margin: 0 auto;
}

/* ===== Hero Section ===== */
.dr-hero {
  position: relative;
  padding: 48px 40px 40px;
  margin-bottom: 28px;
  overflow: hidden;
  background: var(--dr-brand-grad);
  border-radius: var(--dr-radius-2xl);
}
.dr-hero__body {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 36px;
  align-items: center;
  justify-content: space-between;
}
.dr-hero__main {
  flex: 1;
  min-width: 0;
}
.dr-hero__badge-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.dr-hero__badge {
  padding: 4px 14px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 999px;
  letter-spacing: 0.02em;
}
.dr-hero__badge--category {
  color: #fff;
  background: rgb(255 255 255 / 16%);
  border: 1px solid rgb(255 255 255 / 28%);
}
.dr-hero__badge--report {
  color: #fff;
  background: rgb(255 255 255 / 16%);
  border: 1px solid rgb(255 255 255 / 28%);
}
.dr-hero__title {
  margin: 0;
  font-size: 36px;
  font-weight: 700;
  line-height: 1.15;
  color: #fff;
  letter-spacing: -0.02em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dr-hero__title-accent {
  background: linear-gradient(135deg, #E8FFF8, #A8F0E4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.dr-hero__subtitle {
  margin-top: 8px;
  font-size: 16px;
  font-weight: 400;
  color: rgb(255 255 255 / 85%);
  line-height: 1.5;
}
.dr-hero__meta {
  margin-top: 20px;
  display: flex;
  gap: 20px;
  align-items: center;
}
.dr-hero__date {
  font-size: 13px;
  color: rgb(255 255 255 / 75%);
}
.dr-hero__divider-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgb(255 255 255 / 45%);
}
.dr-hero__engine {
  font-size: 13px;
  color: rgb(255 255 255 / 75%);
}
.dr-hero__score-group {
  display: flex;
  flex-shrink: 0;
  gap: 20px;
  align-items: center;
}
.dr-hero__score-ring {
  position: relative;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dr-hero__score-ring svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 120px;
  height: 120px;
  transform: rotate(-90deg);
}
.dr-hero__score-ring-bg {
  fill: none;
  stroke: rgb(255 255 255 / 25%);
  stroke-width: 8;
}
.dr-hero__score-ring-fill {
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.6s ease;
}
.dr-hero__score-inner { text-align: center; }
.dr-hero__score-value {
  font-size: 36px;
  font-weight: 700;
  line-height: 1;
}
.dr-hero__score-unit {
  margin-top: 4px;
  font-size: 13px;
  color: rgb(255 255 255 / 70%);
}
.dr-hero__grade-badge {
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: center;
  padding: 14px 22px;
  border: 1px solid rgb(255 255 255 / 92%);
  border-radius: var(--dr-radius-lg);
  background: rgb(255 255 255 / 92%);
  backdrop-filter: blur(8px);
}
.dr-hero__grade-label {
  font-size: 11px;
  color: #5A6B73;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.dr-hero__grade-value {
  font-size: 30px;
  font-weight: 700;
  line-height: 1;
}
.dr-hero__grade-desc {
  font-size: 12px;
  color: #5A6B73;
}

/* ===== Section ===== */
.dr-section {
  padding: 32px 32px;
  margin-bottom: 20px;
  background: var(--dr-bg-card);
  border: 1px solid var(--dr-border);
  border-radius: var(--dr-radius-xl);
  box-shadow: 0 1px 4px rgb(0 0 0 / 4%);
}
.dr-section__header {
  display: flex;
  gap: 14px;
  align-items: baseline;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--dr-border-subtle);
}
.dr-section__num {
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 700;
  color: var(--dr-primary-deep);
  letter-spacing: 0.04em;
  background: var(--dr-primary-light);
  padding: 2px 8px;
  border-radius: var(--dr-radius-xs);
}
.dr-section__title-group { flex: 1; }
.dr-section__title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  color: var(--dr-text-primary);
}
.dr-section__subtitle {
  margin: 6px 0 0;
  font-size: 14px;
  color: var(--dr-text-tertiary);
}

/* ===== 01 Overview ===== */
.stage-overview__stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.stage-overview__stat-card {
  padding: 16px 14px;
  text-align: center;
  background: var(--dr-bg-subtle);
  border: 1px solid var(--dr-border-light);
  border-radius: var(--dr-radius-sm);
}
.stage-overview__stat-card--score { background: var(--dr-bg-card); border-left: 3px solid var(--dr-primary); }
.stage-overview__stat-card--highlight { background: var(--dr-bg-card); border-left: 3px solid var(--dr-success); }
.stage-overview__stat-card--risk { background: var(--dr-bg-card); border-left: 3px solid var(--dr-warning); }
.stage-overview__stat-value { font-size: 24px; font-weight: 700; color: var(--dr-text-primary); }
.stage-overview__stat-card--score .stage-overview__stat-value { color: var(--dr-primary); }
.stage-overview__stat-card--highlight .stage-overview__stat-value { color: var(--dr-success); }
.stage-overview__stat-card--risk .stage-overview__stat-value { color: var(--dr-warning); }
.stage-overview__stat-label { margin-top: 2px; font-size: 12px; color: var(--dr-text-muted); }
.stage-overview__summary {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  background: var(--dr-bg-subtle);
  border: 1px solid var(--dr-border);
  border-radius: var(--dr-radius-sm);
}
.stage-overview__summary-icon {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  font-size: 14px;
  color: var(--dr-primary);
  background: var(--dr-primary-light);
  border-radius: var(--dr-radius-sm);
}
.stage-overview__summary-text { font-size: 13px; line-height: 1.7; color: var(--dr-text-secondary); white-space: pre-wrap; }
.stage-overview__section { margin-top: 20px; }
.stage-overview__section-title {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 700;
  color: var(--dr-success);
}
.stage-overview__section-title--risk { color: var(--dr-warning); }
.stage-overview__list {
  display: flex;
  flex-direction: column;
  gap: 0;
  border: 1px solid var(--dr-border-light);
  border-radius: var(--dr-radius-sm);
  overflow: hidden;
}
.stage-overview__list-item {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 8px 12px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--dr-text-secondary);
  border-bottom: 1px solid var(--dr-border-subtle);
}
.stage-overview__list-item:last-child { border-bottom: none; }
.stage-overview__list-item--highlight { background: var(--dr-success-light); }
.stage-overview__list-item--risk { background: var(--dr-warning-light); }
.stage-overview__list-item { transition: background 0.15s; }
.stage-overview__list-item:hover { background: var(--dr-bg-subtle); }
.stage-overview__list-icon { flex-shrink: 0; margin-top: 2px; font-size: 13px; }
.stage-overview__list-item--highlight .stage-overview__list-icon { color: var(--dr-success); }
.stage-overview__list-item--risk .stage-overview__list-icon { color: var(--dr-warning); }

/* ===== 01 诊断总览（唯一评分 + 四维拆解）===== */
.stage-aivo__hero {
  display: flex;
  gap: 28px;
  align-items: center;
  padding: 20px;
  background: var(--dr-bg-subtle);
  border: 1px solid var(--dr-border);
  border-radius: var(--dr-radius-lg);
  overflow: visible;
}
.stage-aivo__score-inner { text-align: center; }
.stage-aivo__score-value { font-size: 28px; font-weight: 700; line-height: 1; }
.stage-aivo__score-unit { margin-top: 2px; font-size: 12px; color: var(--dr-text-placeholder); }
.stage-aivo__hero-info { flex: 1; }
.stage-aivo__level-tag { padding: 4px 16px; font-size: 14px; }
.stage-aivo__commentary { margin-top: 12px; font-size: 14px; line-height: 1.7; color: var(--dr-text-muted); }
.stage-aivo__benchmark {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 12px;
  padding: 8px 14px;
  font-size: 13px;
  background: rgb(255 255 255 / 60%);
  border-radius: var(--dr-radius-md);
}
.stage-aivo__benchmark-label { color: var(--dr-text-tertiary); }
.stage-aivo__benchmark-value { font-weight: 700; color: var(--dr-primary); }
.stage-aivo__benchmark-rank { color: var(--dr-text-muted); }
.stage-aivo__benchmark-rank strong { color: var(--dr-success); }
.stage-aivo__dimensions { margin-top: 24px; }
.stage-aivo__dimensions-title { margin-bottom: 16px; font-size: 15px; font-weight: 700; color: var(--dr-text-primary); }
.stage-aivo__dimension-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.stage-aivo__dimension-card {
  padding: 16px;
  background: var(--dr-bg-card);
  border: 1px solid var(--dr-border-light);
  border-left: 3px solid var(--dim-color);
  border-radius: var(--dr-radius-md);
}
.stage-aivo__dimension-score { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
.stage-aivo__dimension-num { font-size: 22px; font-weight: 700; color: var(--dim-color); }
.stage-aivo__dimension-weight { font-size: 12px; font-weight: 600; color: var(--dr-text-placeholder); }
.stage-aivo__dimension-name { margin-bottom: 6px; font-size: 14px; font-weight: 600; color: var(--dr-text-primary); }
.stage-aivo__dimension-comment { margin-bottom: 10px; font-size: 12px; line-height: 1.6; color: var(--dr-text-tertiary); }

/* ===== 03 User Profile ===== */
.stage-user-profile { display: flex; flex-wrap: wrap; gap: 24px; }
.stage-up__radar-section {
  width: 100%;
  padding: 24px;
  background: var(--dr-bg-subtle);
  border: 1px solid var(--dr-border);
  border-radius: var(--dr-radius-lg);
  box-sizing: border-box;
  overflow: visible;
}
.stage-up__section-title { margin-bottom: 16px; font-size: 15px; font-weight: 700; color: var(--dr-text-primary); }
.stage-up__radar-row { display: flex; gap: 24px; align-items: flex-start; }
.stage-up__radar-chart-wrap { flex-shrink: 0; width: 220px; max-width: 100%; overflow: visible; }
.stage-up__dimension-list {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.stage-up__dim-item { display: flex; gap: 8px; align-items: center; }
.stage-up__dim-label { width: 72px; font-size: 13px; color: var(--dr-text-muted); text-align: right; white-space: nowrap; }
.stage-up__dim-bar { flex: 1; height: 8px; background: var(--dr-bg-bar-track); border-radius: var(--dr-radius-xs); overflow: hidden; }
.stage-up__dim-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.stage-up__dim-value { width: 28px; font-size: 14px; font-weight: 700; color: var(--dr-primary); }
.stage-up__groups { flex: 1; min-width: 260px; }
.stage-up__groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.stage-up__group-card { padding: 18px; background: var(--dr-bg-card); border: 1px solid var(--dr-border-light); border-radius: var(--dr-radius-md); }
.stage-up__group-highlight { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 15px; font-weight: 700; color: var(--dr-text-primary); }
.stage-up__group-index {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  background: var(--dr-primary);
  border-radius: 50%;
  flex-shrink: 0;
}
.stage-up__group-profile, .stage-up__group-scenario { margin-bottom: 8px; font-size: 13px; line-height: 1.7; color: var(--dr-text-muted); }
.stage-up__group-profile strong, .stage-up__group-scenario strong { color: var(--dr-text-primary); }
.stage-up__questions-label { margin-bottom: 6px; font-size: 12px; font-weight: 600; color: var(--dr-text-tertiary); }
.stage-up__questions-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.stage-up__question-tag {
  max-width: 240px;
  overflow: hidden;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 2px 8px;
  border-radius: var(--dr-radius-sm);
  color: var(--dr-primary);
  background: var(--dr-primary-light);
  border: 1px solid var(--dr-primary-border);
}

/* ===== 04 AI Search ===== */
.stage-ais__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.stage-ais__stat-card {
  padding: 20px 16px;
  text-align: center;
  background: var(--dr-bg-subtle);
  border: 1px solid var(--dr-border-light);
  border-radius: var(--dr-radius-md);
}
.stage-ais__stat-card--primary { background: var(--dr-bg-card); border-left: 3px solid var(--dr-primary); }
.stage-ais__stat-value { font-size: 26px; font-weight: 700; color: var(--dr-text-primary); }
.stage-ais__stat-card--primary .stage-ais__stat-value { color: var(--dr-primary); }
.stage-ais__stat-unit { font-size: 14px; font-weight: 600; }
.stage-ais__stat-label { margin-top: 4px; font-size: 12px; color: var(--dr-text-tertiary); }
.stage-ais__section { margin-top: 24px; }
.stage-ais__section-title { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; font-size: 15px; font-weight: 700; color: var(--dr-text-primary); }
.stage-ais__section-count { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--dr-text-placeholder); }
.stage-ais__platform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.stage-ais__platform-card { padding: 16px; background: var(--dr-danger-light); border: 1px solid var(--dr-danger-border); border-radius: var(--dr-radius-md); }
.stage-ais__platform-card--mentioned { background: var(--dr-success-light); border-color: var(--dr-success-border); }
.stage-ais__platform-header { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.stage-ais__platform-name { font-size: 14px; font-weight: 700; color: var(--dr-text-primary); }
.stage-ais__platform-tag { font-size: 11px; font-weight: 600; border-radius: var(--dr-radius-sm); padding: 2px 8px; background: var(--dr-bg-subtle); color: var(--dr-text-tertiary); }
.stage-ais__platform-metrics { display: flex; gap: 12px; font-size: 12px; color: var(--dr-text-tertiary); }
.stage-ais__platform-metrics strong { color: var(--dr-text-primary); }
.stage-ais__question-table { border: 1px solid var(--dr-border-light); border-radius: var(--dr-radius-md); overflow: hidden; }
.stage-ais__qtable-head {
  display: flex;
  gap: 0;
  padding: 10px 16px;
  font-size: 12px;
  font-weight: 700;
  color: var(--dr-text-tertiary);
  background: var(--dr-bg-subtle);
  border-bottom: 1px solid var(--dr-border-light);
}
.stage-ais__qtable-row {
  display: flex;
  gap: 0;
  padding: 10px 16px;
  border-bottom: 1px solid var(--dr-border-subtle);
  transition: background 0.15s;
}
.stage-ais__qtable-row:last-child { border-bottom: none; }
.stage-ais__qtable-row:hover { background: var(--dr-bg-subtle); }
.stage-ais__qtable-col--question { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.stage-ais__qtable-col--platforms { flex-shrink: 0; width: 180px; display: flex; align-items: center; justify-content: flex-end; }
.stage-ais__q-text { font-size: 13px; font-weight: 600; color: var(--dr-text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; max-width: 50%; }
.stage-ais__q-highlight { font-size: 11px; color: var(--dr-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.stage-ais__q-mentions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.stage-ais__q-mention-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 20px;
  padding: 0 4px;
  font-size: 10px;
  font-weight: 600;
  border-radius: 4px;
}
.stage-ais__q-mention-dot--yes { color: var(--dr-success); background: var(--dr-success-light); border: 1px solid var(--dr-success-border); }
.stage-ais__q-mention-dot--no { color: var(--dr-text-tertiary); background: var(--dr-bg-subtle); border: 1px solid var(--dr-bg-bar-track); }

/* ===== 05 Infra Eval ===== */
.stage-infra__grid { display: flex; flex-direction: column; gap: 16px; }
.stage-infra__card { overflow: hidden; background: var(--dr-bg-card); border: 1px solid var(--dr-border-light); border-radius: var(--dr-radius-md); }
.stage-infra__card--site { border-left: 3px solid var(--dr-primary); }
.stage-infra__card-header {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 14px 16px;
  background: var(--dr-bg-subtle);
  border-bottom: 1px solid var(--dr-border-subtle);
}
.stage-infra__card-icon { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; font-size: 16px; border-radius: var(--dr-radius-md); }
.stage-infra__card-icon--site { color: var(--dr-primary); background: var(--dr-primary-light); }
.stage-infra__card-icon--media { color: var(--dr-sky); background: var(--dr-sky-light); }
.stage-infra__card-icon--auth { color: var(--dr-purple); background: var(--dr-purple-light); }
.stage-infra__card-title { flex: 1; font-size: 14px; font-weight: 700; color: var(--dr-text-primary); }
.stage-infra__card-body { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.stage-infra__banner { overflow: hidden; border-radius: var(--dr-radius-md); }
.stage-infra__banner-img { display: block; width: 100%; max-height: 200px; object-fit: cover; border-radius: var(--dr-radius-md); }
.stage-infra__logo-row { display: flex; align-items: center; }

.sg-action-card__evidence { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

.sg-action-card__evidence-tag { padding: 2px 8px; font-size: 11px; font-weight: 600; color: var(--dr-primary); background: var(--dr-primary-light); border-radius: var(--dr-radius-sm); }
.sg-action-card__steps { margin-top: 12px; }
.sg-action-card__steps-label { margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--dr-primary); }

.sg-action-card__step-icon { flex-shrink: 0; margin-top: 3px; font-size: 10px; color: var(--dr-primary); }
.sg-roadmap__timeline { display: flex; gap: 0; align-items: flex-start; }
.sg-roadmap__phase { flex: 1; min-width: 0; }
.sg-roadmap__phase-connector { width: 32px; height: 2px; margin: 20px -16px 0; background: linear-gradient(90deg, var(--dr-primary-border), var(--dr-info-border)); flex-shrink: 0; }
.sg-roadmap__phase-header { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.sg-roadmap__phase-badge { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; font-size: 13px; font-weight: 700; color: #fff; border-radius: var(--dr-radius-lg); flex-shrink: 0; }
.sg-roadmap__phase--0 .sg-roadmap__phase-badge { background: var(--dr-danger); }
.sg-roadmap__phase--1 .sg-roadmap__phase-badge { background: var(--dr-warning); }
.sg-roadmap__phase--2 .sg-roadmap__phase-badge { background: var(--dr-success); }
.sg-roadmap__phase-title { font-size: 14px; font-weight: 700; color: var(--dr-text-primary); }
.sg-roadmap__phase-timeline { font-size: 12px; color: var(--dr-text-placeholder); }
.sg-roadmap__phase-items { display: flex; flex-direction: column; gap: 6px; padding: 14px; background: var(--dr-bg-subtle); border: 1px solid var(--dr-border-light); border-radius: var(--dr-radius-md); }
.sg-roadmap__item { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: var(--dr-text-muted); }
.sg-roadmap__item-dot { flex-shrink: 0; width: 6px; height: 6px; margin-top: 7px; background: var(--dr-text-placeholder); border-radius: 50%; }
.sg-roadmap__phase--0 .sg-roadmap__item-dot { background: var(--dr-danger); }
.sg-roadmap__phase--1 .sg-roadmap__item-dot { background: var(--dr-warning); }
.sg-roadmap__phase--2 .sg-roadmap__item-dot { background: var(--dr-success); }
.sg-longterm__list { display: flex; flex-direction: column; gap: 8px; }
.sg-longterm__item { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--dr-bg-subtle); border: 1px solid var(--dr-border-light); border-radius: var(--dr-radius-md); transition: border-color 0.15s ease; }
.sg-longterm__item:hover { border-color: var(--dr-primary-border); }
.sg-longterm__num { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; font-size: 12px; font-weight: 700; color: var(--dr-primary); background: var(--dr-primary-light); border-radius: 50%; }
.sg-longterm__content { flex: 1; min-width: 0; }
.sg-longterm__text-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sg-longterm__text { font-size: 14px; line-height: 1.5; color: var(--dr-text-secondary); }
.sg-longterm__timeline { display: inline-block; padding: 1px 8px; font-size: 11px; color: var(--dr-primary); background: var(--dr-primary-light); border-radius: 999px; white-space: nowrap; }
.sg-summary { display: flex; gap: 16px; padding: 24px; background: var(--dr-bg-subtle); border: 1px solid var(--dr-border); border-radius: var(--dr-radius-lg); }
.sg-summary__icon-wrap { display: flex; flex-shrink: 0; align-items: center; justify-content: center; width: 44px; height: 44px; font-size: 20px; color: var(--dr-primary); background: var(--dr-bg-card); border-radius: var(--dr-radius-md); }
.sg-summary__label { margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--dr-primary); }
.sg-summary__text { font-size: 14px; line-height: 1.8; color: var(--dr-text-secondary); }

/* ===== Executive Summary ===== */
.dr-summary {
  padding: 24px 28px;
  margin-bottom: 20px;
  background: var(--dr-bg-card);
  border: 1px solid var(--dr-border);
  border-left: 4px solid var(--dr-primary);
  border-radius: var(--dr-radius-xl);
  box-shadow: 0 1px 4px rgb(0 0 0 / 4%);
}
.dr-summary__title { margin: 0 0 20px; font-size: 18px; font-weight: 600; color: var(--dr-text-primary); }
.dr-summary__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.dr-summary__item { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-radius: var(--dr-radius-lg); }
.dr-summary__item--positive { background: var(--dr-success-light); border: 1px solid var(--dr-success-border); }
.dr-summary__item--negative { background: var(--dr-danger-light); border: 1px solid var(--dr-danger-border); }
.dr-summary__item--action { background: var(--dr-primary-light); border: 1px solid var(--dr-primary-border); }
.dr-summary__icon { flex-shrink: 0; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border-radius: 999px; }
.dr-summary__item--positive .dr-summary__icon { color: var(--dr-success); background: var(--dr-success-light); }
.dr-summary__item--negative .dr-summary__icon { color: var(--dr-danger); background: var(--dr-danger-light); }
.dr-summary__item--action .dr-summary__icon { color: var(--dr-primary); background: var(--dr-primary-light); }
.dr-summary__text { font-size: 14px; line-height: 1.6; color: var(--dr-text-secondary); }

/* ===== Report Footer ===== */
.dr-footer { margin-top: 40px; }
.dr-footer__divider { height: 1px; margin-bottom: 28px; background: linear-gradient(90deg, transparent, var(--dr-border) 20%, var(--dr-border) 80%, transparent); }
.dr-footer__content { display: flex; flex-direction: column; gap: 16px; padding: 0 8px; }
.dr-footer__block { padding: 14px 18px; background: var(--dr-bg-subtle); border-radius: var(--dr-radius-lg); }
.dr-footer__title { margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--dr-text-muted); }
.dr-footer__text { font-size: 13px; line-height: 1.8; color: var(--dr-text-tertiary); }
.dr-footer__meta { display: flex; gap: 24px; padding-top: 14px; font-size: 12px; color: var(--dr-text-placeholder); }

/* ===== Right-side Floating Navigation ===== */
.dr-side-nav {
  position: fixed;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 8px 5px 8px 6px;
  background: rgb(255 255 255 / 92%);
  border: 1px solid var(--dr-border-light);
  border-radius: var(--dr-radius-xl);
  box-shadow: 0 2px 16px rgb(15 23 42 / 8%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.dr-side-nav__item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  padding: 4px 8px 4px 4px;
  text-decoration: none;
  border-radius: var(--dr-radius-md);
  transition: background 0.15s;
  white-space: nowrap;
}
.dr-side-nav__item:hover {
  background: var(--dr-primary-light);
}
.dr-side-nav__item--active {
  background: var(--dr-primary-light);
}
.dr-side-nav__num {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  font-size: 10px;
  font-weight: 700;
  color: var(--dr-text-placeholder);
  border-radius: 6px;
  transition: all 0.2s;
  user-select: none;
}
.dr-side-nav__item:hover .dr-side-nav__num {
  color: var(--dr-primary);
  background: rgb(19 190 147 / 10%);
}
.dr-side-nav__item--active .dr-side-nav__num {
  color: #fff;
  background: var(--dr-primary);
}
.dr-side-nav__label {
  font-size: 11px;
  font-weight: 500;
  color: var(--dr-text-tertiary);
  transition: color 0.15s, font-weight 0.15s;
  line-height: 1;
}
.dr-side-nav__item:hover .dr-side-nav__label {
  color: var(--dr-text-secondary);
}
.dr-side-nav__item--active .dr-side-nav__label {
  color: var(--dr-primary);
  font-weight: 700;
}
.dr-side-nav__divider {
  width: 20px;
  height: 1px;
  background: var(--dr-border-subtle);
  margin: 2px 0 2px 4px;
  flex-shrink: 0;
}

/* ===== SVG Chart Styles ===== */
.dr-radar-chart {
  display: block;
  width: 100%;
  margin: 0 auto;
}
.dr-radar-chart__grid { fill: none; stroke: var(--dr-bg-bar-track); stroke-width: 1; }
.dr-radar-chart__axis { stroke: var(--dr-bg-bar-track); stroke-width: 1; }
.dr-radar-chart__area { transition: opacity 0.3s; }
.dr-radar-chart__area:hover { opacity: 0.85 !important; }
.dr-radar-chart__dot { transition: r 0.2s; }
.dr-radar-chart__dot:hover { r: 6; }
.dr-radar-chart__label { font-size: 12px; fill: var(--dr-text-muted); font-weight: 600; }

.dr-donut-chart { display: block; width: 100%; margin: 0 auto; }
.dr-donut-chart__center-text { font-size: 16px; font-weight: 700; fill: var(--dr-text-primary); }
.dr-donut-chart__center-label { font-size: 10px; fill: var(--dr-text-tertiary); }

.dr-hbar-chart { display: block; width: 100%; }
.dr-hbar-chart__bar-bg { fill: var(--dr-border-subtle); rx: 4; }
.dr-hbar-chart__bar-fill { rx: 4; transition: width 0.6s ease; }
.dr-hbar-chart__label { font-size: 12px; fill: var(--dr-text-secondary); font-weight: 600; }
.dr-hbar-chart__value { font-size: 12px; fill: var(--dr-text-primary); font-weight: 700; }

/* ===== Entrance Animations (disabled) ===== */
.dr-section {
  opacity: 1;
  transform: none;
}
.dr-hero {
  opacity: 1;
  transform: none;
}
.dr-summary {
  opacity: 1;
  transform: none;
}

/* ===== Hero Gradient Animation ===== */
.dr-hero__gradient-anim {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, #13BE93 0%, #2DB1BD 40%, #13BE93 60%, #2DB1BD 100%);
  background-size: 300% 300%;
  animation: heroGradient 8s ease infinite;
  border-radius: inherit;
}
@keyframes heroGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== Card Hover Effects ===== */
.stage-overview__stat-card:hover,
.stage-aivo__dimension-card:hover,
.stage-up__group-card:hover,
.stage-ais__platform-card:hover,
.stage-infra__card:hover,
.stage-geo__stat-card:hover,
.stage-sentiment__indicator:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgb(15 23 42 / 8%);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.stage-overview__stat-card,
.stage-aivo__dimension-card,
.stage-up__group-card,
.stage-ais__platform-card,
.stage-infra__card,
.stage-geo__stat-card,
.stage-sentiment__indicator {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

/* ===== Responsive ===== */
@media (max-width: 992px) {
  .dr-side-nav { display: none; }
  .dr-content { width: calc(100% - 32px); padding-right: 0; }
  .dr-hero__body { flex-direction: column; text-align: center; }
  .dr-hero__title { font-size: 26px; text-align: center; }
  .dr-hero__badge-row { justify-content: center; }
  .dr-hero__meta { justify-content: center; }
  .dr-hero__score-group { justify-content: center; }
  .stage-overview__stats { grid-template-columns: repeat(2, 1fr); }
  .stage-geo__stats { grid-template-columns: repeat(2, 1fr); }
  .stage-comp__compare-table { overflow-x: auto; }
  .sg-roadmap__timeline { flex-wrap: wrap; }
  .sg-roadmap__phase { min-width: 200px; }
}
@media (max-width: 768px) {
  .dr-page { padding-top: 0; }
  .dr-content { width: calc(100% - 24px); }
  .dr-hero { padding: 36px 20px; }
  .dr-hero__title { font-size: 24px; }
  .dr-hero__subtitle { font-size: 16px; }
  .dr-section { padding: 24px 18px; }
  .stage-overview__stats { grid-template-columns: 1fr; }
  .stage-ais__stats { grid-template-columns: 1fr; }
  .stage-ais__platform-grid { grid-template-columns: 1fr; }
  .stage-ais__qtable-col--platforms { width: 120px; }
  .stage-aivo__hero { flex-direction: column; }
  .stage-up__radar-section { width: 100%; }
  .stage-up__radar-row { flex-direction: column; align-items: center; }
  .stage-up__radar-chart-wrap { width: 100%; max-width: 240px; }
  .stage-up__dimension-list { grid-template-columns: 1fr; }
  .stage-up__groups { min-width: 0; }
  .stage-geo__stats { grid-template-columns: repeat(2, 1fr); }
  .stage-geo__chart-row { flex-direction: column; }
  .stage-sentiment__top-row { flex-direction: column; }
  .stage-sentiment__indicators { flex-direction: column; }
  .stage-sentiment__mini-chart { width: 100%; }
  .sg-projection__header { flex-direction: column; align-items: flex-start; }
  .sg-dims__grid { grid-template-columns: 1fr; }
  .sg-quickwins__grid { grid-template-columns: 1fr; }
  .sg-roadmap__timeline { flex-direction: column; }
  .sg-roadmap__phase-connector { width: 2px; height: 24px; margin: 0 0 0 17px; background: linear-gradient(180deg, var(--dr-primary-border), var(--dr-info-border)); }
  .stage-comp__compare-table { overflow-x: auto; }
  .stage-comp__ctable-col--dim { width: 80px; }
}
@media print {
  body { background: #fff !important; }
  .dr-side-nav { display: none !important; }
  .dr-page { min-height: auto !important; padding: 0 !important; background: #fff !important; }
  .dr-content { width: 100% !important; max-width: 100% !important; padding: 0 !important; }
  .dr-hero { background: var(--dr-bg-subtle) !important; color: var(--dr-text-primary) !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .dr-hero__title, .dr-hero__subtitle { color: var(--dr-text-primary) !important; }
  .dr-hero__date { color: var(--dr-text-tertiary) !important; }
  .dr-section { page-break-inside: avoid; break-inside: avoid; border: 1px solid var(--dr-bg-bar-track) !important; box-shadow: none !important; opacity: 1 !important; transform: none !important; }
  .dr-hero { opacity: 1 !important; transform: none !important; }
  .dr-summary { opacity: 1 !important; transform: none !important; }
  .dr-footer { page-break-inside: avoid; }
}

  /* ===== Stage0: Platform matrix ===== */

  .stage-pm__table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 880px; }
  .stage-pm__table th { padding: 8px 10px; background: var(--dr-bg-subtle); color: var(--dr-text-secondary); font-weight: 600; border-bottom: 1px solid var(--dr-border); text-align: center; white-space: nowrap; }
  .stage-pm__table th:first-child, .stage-pm__table td:first-child { text-align: left; }
  .stage-pm__table td { padding: 9px 10px; border-bottom: 1px solid var(--dr-border-subtle); text-align: center; }
  .stage-pm__platform { font-weight: 700; color: var(--dr-text-primary); white-space: nowrap; }
  .stage-pm__platform-type { display: block; font-size: 11px; font-weight: 400; color: var(--dr-text-tertiary); }
  .stage-pm__cell { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-width: 58px; }
  .stage-pm__dot { width: 10px; height: 10px; border-radius: 50%; }
  .stage-pm__dot--yes { background: var(--dr-primary); }
  .stage-pm__dot--no { background: var(--dr-text-disabled); }
  .stage-pm__senti { font-size: 11px; color: var(--dr-text-tertiary); }
  .stage-pm__citi { font-size: 10px; padding: 1px 6px; border-radius: 999px; }
  .stage-pm__citi--high { color: var(--dr-success); background: var(--dr-success-light); }
  .stage-pm__citi--medium { color: var(--dr-warning); background: var(--dr-warning-light); }
  .stage-pm__citi--low { color: var(--dr-text-tertiary); background: var(--dr-bg-subtle); }
  .stage-pm__ai-note { font-size: 11px; color: var(--dr-warning); }
  .stage-pm__summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .stage-pm__summary-item { padding: 8px 14px; background: var(--dr-bg-subtle); border: 1px solid var(--dr-border); border-radius: var(--dr-radius-sm); font-size: 12.5px; color: var(--dr-text-secondary); }
  .stage-pm__summary-item b { color: var(--dr-primary); }
  .stage-pm__legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 11.5px; color: var(--dr-text-tertiary); }
  .stage-pm__legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .stage-pm__empty { font-size: 13px; color: var(--dr-text-tertiary); padding: 8px 0; }

  /* ===== Stage0: Question pool ===== */
  .stage-qp__table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .stage-qp__table th { text-align: left; padding: 8px 10px; background: var(--dr-bg-subtle); color: var(--dr-text-secondary); font-weight: 600; border-bottom: 1px solid var(--dr-border); white-space: nowrap; }
  .stage-qp__table td { padding: 10px; border-bottom: 1px solid var(--dr-border-subtle); color: var(--dr-text-secondary); vertical-align: top; }
  .stage-qp__intent { font-weight: 700; color: var(--dr-text-primary); white-space: nowrap; }
  .stage-qp__presence { display: inline-block; padding: 2px 10px; font-size: 12px; font-weight: 700; border-radius: 999px; }
  .stage-qp__presence--present { color: var(--dr-success); background: var(--dr-success-light); }
  .stage-qp__presence--partial { color: var(--dr-warning); background: var(--dr-warning-light); }
  .stage-qp__presence--absent { color: var(--dr-danger); background: var(--dr-danger-light); }
  .stage-qp__pri { display: inline-block; padding: 2px 10px; font-size: 12px; font-weight: 700; border-radius: 999px; }
  .stage-qp__pri--P0 { color: #fff; background: var(--dr-danger); }
  .stage-qp__pri--P1 { color: #fff; background: var(--dr-warning); }
  .stage-qp__pri--P2 { color: #fff; background: var(--dr-primary); }
  .stage-qp__gaps { font-size: 12.5px; color: var(--dr-text-secondary); }
  .stage-qp__gaps li { margin-left: 16px; }
  .stage-qp__q { font-size: 12.5px; color: var(--dr-text-tertiary); }

  /* ===== Stage0: Opportunity map ===== */
  .stage-om__group { margin-bottom: 18px; }
  .stage-om__group-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--dr-text-primary); margin-bottom: 10px; }
  .stage-om__count { padding: 1px 8px; font-size: 11px; font-weight: 700; border-radius: 999px; color: #fff; }
  .stage-om__count--P0 { background: var(--dr-danger); }
  .stage-om__count--P1 { background: var(--dr-warning); }
  .stage-om__count--P2 { background: var(--dr-primary); }
  .stage-om__card { background: var(--dr-bg-card); border: 1px solid var(--dr-border); border-radius: var(--dr-radius-lg); padding: 16px 18px; margin-bottom: 12px; }
  .stage-om__card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .stage-om__title { font-size: 14.5px; font-weight: 700; color: var(--dr-text-primary); }
  .stage-om__id { font-size: 11px; color: var(--dr-text-tertiary); white-space: nowrap; }
  .stage-om__rationale { font-size: 13px; color: var(--dr-text-secondary); margin-bottom: 10px; }
  .stage-om__block { margin-top: 8px; }
  .stage-om__block-label { font-size: 12px; font-weight: 700; color: var(--dr-text-tertiary); margin-bottom: 4px; }
  .stage-om__list { font-size: 12.5px; color: var(--dr-text-secondary); }
  .stage-om__list li { margin-left: 16px; margin-bottom: 2px; }
  .stage-om__impact { display: inline-block; margin-top: 8px; padding: 4px 12px; font-size: 12px; font-weight: 600; color: var(--dr-primary); background: var(--dr-primary-light); border-radius: 999px; }
  .stage-om__open { margin-top: 16px; padding: 14px 16px; background: var(--dr-warning-light); border: 1px solid var(--dr-warning-border); border-radius: var(--dr-radius-sm); }
  .stage-om__open-title { font-size: 13px; font-weight: 700; color: var(--dr-warning); margin-bottom: 6px; }
  .stage-om__open-item { font-size: 12.5px; color: var(--dr-text-secondary); margin-bottom: 4px; }

  /* ===== v2.0：四幕导航分组 · 证据列表 · 差距溯源 · 简报摘要 ===== */
  .dr-side-nav__group {
    padding: 14px 0 4px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: var(--dr-text-placeholder);
  }
  .dr-side-nav__group:first-child { padding-top: 0; }
  .dr-ev {
    margin-top: 18px;
    padding: 14px 16px;
    background: var(--dr-bg-subtle);
    border: 1px solid var(--dr-border);
    border-radius: var(--dr-radius-lg);
  }
  .dr-ev__label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; font-weight: 700; color: var(--dr-text-secondary); }
  .dr-ev__count { padding: 1px 9px; font-size: 11px; font-weight: 600; color: var(--dr-primary); background: var(--dr-primary-light); border-radius: 999px; }
  .dr-ev__list { display: grid; gap: 7px; }
  .dr-ev__item { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; line-height: 1.6; }
  .dr-ev__link { color: var(--dr-primary); text-decoration: none; word-break: break-all; }
  .dr-ev__link:hover { text-decoration: underline; }
  .dr-ev__text { color: var(--dr-text-secondary); }
  .dr-ev__date { flex-shrink: 0; font-size: 11px; color: var(--dr-text-placeholder); }
  .dr-ev__supports { flex-shrink: 0; font-size: 11px; color: var(--dr-text-secondary); }
  .dr-ev__chip { display: inline-block; margin-top: 8px; padding: 2px 9px; font-size: 11px; font-weight: 600; color: var(--dr-primary); background: var(--dr-primary-light); border-radius: 999px; }
  .dr-ev__null { margin-top: 8px; font-size: 11px; font-weight: 600; color: var(--dr-warning); }
  .stage-ais__platform-card--ev { background: var(--dr-success-light); border-color: var(--dr-success-border); }
  .stage-ais__platform-card--ev-empty { background: var(--dr-warning-light); border-color: var(--dr-warning-border); }
  .dr-scope-note {
    margin-bottom: 18px;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--dr-text-secondary);
    background: #FFF4CC;
    border-left: 3px solid var(--dr-warning);
    border-radius: var(--dr-radius-md);
  }
  .stage-om__src { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 10px; }
  .stage-om__src-label { font-size: 11px; font-weight: 700; color: var(--dr-text-placeholder); }
  .stage-om__src-chip { padding: 2px 9px; font-size: 11px; color: var(--dr-primary); background: var(--dr-primary-light); border-radius: 999px; }
  .dr-summary__grid--brief { grid-template-columns: auto 1fr; align-items: center; }
  .dr-summary__item--score { flex-direction: column; align-items: center; justify-content: center; min-width: 96px; padding-right: 22px; border-right: 1px solid var(--dr-border); }
  .dr-summary__score { font-size: 36px; font-weight: 800; line-height: 1; }
  .dr-summary__grade { margin-top: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
  .dr-summary__item--conclusion { background: var(--dr-primary-light); border: 1px solid var(--dr-primary-border); }
  @media (max-width: 640px) {
    .dr-summary__grid--brief { grid-template-columns: 1fr; }
    .dr-summary__item--score { border-right: none; border-bottom: 1px solid var(--dr-border); padding: 0 0 12px; }
  }
</style>

<nav class="dr-side-nav" id="side-nav"></nav>

<script id="report-data" type="application/json">{}</script>
<script>
(function() {
  'use strict';

  // ===== Utilities =====
  function esc(s) { if (s == null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  /* 语义色一律取深色阶，保证在白底上对比度 ≥5:1（原先的高亮橙/青在白底只有 2–3:1） */
  function getColor(score) {
    if (score >= 90) return '#047857';
    if (score >= 75) return '#0F766E';
    if (score >= 60) return '#B45309';
    return '#B91C1C';
  }
  function getGrade(score) {
    if (score >= 90) return '优秀';
    if (score >= 75) return '良好';
    if (score >= 60) return '一般';
    return '较差';
  }
  function getGradeInfo(grade) {
    var map = {
      '优秀': { color: '#047857', bg: '#ecfdf5', label: 'A' },
      '良好': { color: '#0F766E', bg: '#f0fdfa', label: 'B' },
      '一般': { color: '#B45309', bg: '#fffbeb', label: 'C' },
      '较差': { color: '#B91C1C', bg: '#fef2f2', label: 'D' }
    };
    return map[grade] || map['一般'];
  }
  function getMentionColor(rate) {
    if (rate >= 0.5) return '#047857';
    if (rate >= 0.25) return '#B45309';
    return '#B91C1C';
  }
  function getPriorityInfo(priority) {
    var map = {
      'high': { color: 'var(--dr-orange)', bg: 'var(--dr-orange-light)', label: 'P1高优', cls: 'urgent' },
      'medium': { color: 'var(--dr-warning)', bg: 'var(--dr-warning-light)', label: 'P2中等', cls: 'medium' },
      'low': { color: 'var(--dr-success)', bg: 'var(--dr-success-light)', label: 'P3建议', cls: 'low' }
    };
    return map[priority] || map['medium'];
  }
  function fmtRate(r) { return (r * 100).toFixed(1); }
  /* circumference calculated inline per chart */

  // 四维配色：深色阶，彼此色相拉开，白底对比度均 ≥4.9:1
  var DIM_COLORS = {
    'AI_SEARCH_VISIBILITY': '#4F46E5',
    'INFRA_COMPLETENESS': '#0E7490',
    'COMPETITIVE_ADVANTAGE': '#B45309',
    'SENTIMENT_HEALTH': '#047857'
  };
  var DIM_NAMES = {
    'AI_SEARCH_VISIBILITY': 'AI 可引用内容覆盖',
    'INFRA_COMPLETENESS': '基建完善度',
    'COMPETITIVE_ADVANTAGE': '竞品对比优势',
    'SENTIMENT_HEALTH': '舆情健康度'
  };

  // ===== 章节映射（stageCode → 四幕12章编号）与证据渲染 =====
  var CHAPTER_OF_STAGE = {
    'ENTITY_MAP': '02 实体身份诊断',
    'PLATFORM_MATRIX': '03 站外资产矩阵',
    'QUESTION_POOL': '04 问题池与信源缺口',
    'USER_PROFILE': '05 用户画像',
    'AI_SEARCH': '06 AI 可引用内容覆盖',
    'INFRA_EVAL': '07 基建评估',
    'COMPETITOR': '08 竞品对标',
    'SENTIMENT': '09 舆情分析',
    'GEO_EFFECT': '10 信源收录证据'
  };
  function chapterOf(code) { return CHAPTER_OF_STAGE[code] || code || ''; }

  /** 证据来源列表：每条断言必须可点回原始页面（URL + 日期） */
  function renderEvidence(list, label) {
    list = list || [];
    if (!list.length) return '';
    var h = '<div class="dr-ev"><div class="dr-ev__label">' + esc(label || '证据来源') +
      '<span class="dr-ev__count">' + list.length + ' 条</span></div><div class="dr-ev__list">';
    list.forEach(function (e) {
      if (typeof e === 'string') {
        h += '<div class="dr-ev__item"><span class="dr-ev__text">' + esc(e) + '</span></div>';
        return;
      }
      var url = e.url || e.sourceUrl || '';
      var date = e.date || e.publishedAt || '';
      var title = e.title || e.source || e.snippet || url;
      h += '<div class="dr-ev__item">' +
        (url
          ? '<a class="dr-ev__link" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(title) + '</a>'
          : '<span class="dr-ev__text">' + esc(title) + '</span>') +
        (date ? '<span class="dr-ev__date">' + esc(date) + '</span>' : '') +
        (e.supports ? '<span class="dr-ev__supports">' + esc(e.supports) + '</span>' : '') +
        '</div>';
    });
    h += '</div></div>';
    return h;
  }

  // ===== SVG Chart Helpers =====

  /**
   * 生成雷达图SVG
   * @param {Array} labels - 维度标签数组
   * @param {Array} values - 维度值数组(0-100)
   * @param {Array} colors - 维度颜色数组
   * @param {number} size - SVG尺寸
   * @param {string} fillColor - 填充颜色
   * @returns {string} SVG HTML字符串
   */
  function renderRadarChart(labels, values, colors, size, fillColor) {
    size = size || 260;
    fillColor = fillColor || 'rgb(19 190 147 / 18%)';
    var cx = size / 2;
    var cy = size / 2;
    var maxR = size / 2 - 70;
    var n = labels.length;
    if (n < 3) return '';

    function angle(i) { return (Math.PI * 2 * i / n) - Math.PI / 2; }
    function point(i, r) {
      var a = angle(i);
      return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
    }

    var svg = '<svg class="dr-radar-chart" viewBox="0 0 ' + size + ' ' + size + '">';

    // Grid rings (3 levels)
    for (var level = 1; level <= 3; level++) {
      var r = maxR * level / 3;
      var pts = [];
      for (var i = 0; i < n; i++) {
        var p = point(i, r);
        pts.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
      }
      svg += '<polygon class="dr-radar-chart__grid" points="' + pts.join(' ') + '"/>';
    }

    // Axis lines
    for (var i = 0; i < n; i++) {
      var p = point(i, maxR);
      svg += '<line class="dr-radar-chart__axis" x1="' + cx + '" y1="' + cy + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '"/>';
    }

    // Data area
    var dataPts = [];
    for (var i = 0; i < n; i++) {
      var v = Math.max(0, Math.min(100, values[i] || 0));
      var r = maxR * v / 100;
      var p = point(i, r);
      dataPts.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
    }
    svg += '<polygon class="dr-radar-chart__area" points="' + dataPts.join(' ') + '" fill="' + fillColor + '" stroke="' + (colors[0] || 'var(--dr-primary)') + '" stroke-width="2"/>';

    // Data dots
    for (var i = 0; i < n; i++) {
      var v = Math.max(0, Math.min(100, values[i] || 0));
      var r = maxR * v / 100;
      var p = point(i, r);
      svg += '<circle class="dr-radar-chart__dot" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4" fill="' + (colors[i] || '#4F46E5') + '" stroke="#fff" stroke-width="1.5"/>';
    }

    // Labels
    for (var i = 0; i < n; i++) {
      var p = point(i, maxR + 22);
      var anchor = 'middle';
      var dx = 0;
      var dy = 0;
      var a = angle(i);
      if (Math.abs(Math.cos(a)) > 0.3) {
        dx = Math.cos(a) > 0 ? 4 : -4;
        anchor = Math.cos(a) > 0 ? 'start' : 'end';
      }
      if (Math.sin(a) < -0.5) dy = -4;
      if (Math.sin(a) > 0.5) dy = 6;
      svg += '<text class="dr-radar-chart__label" x="' + (p.x + dx).toFixed(1) + '" y="' + (p.y + dy).toFixed(1) + '" text-anchor="' + anchor + '">' + esc(labels[i]) + '</text>';
    }

    svg += '</svg>';
    return svg;
  }

  /**
   * 生成环形图SVG
   * @param {number} positive - 正面比例(0-1)
   * @param {number} negative - 负面比例(0-1)
   * @param {number} neutral - 中性比例(0-1)
   * @param {number} size - SVG尺寸
   * @returns {string} SVG HTML字符串
   */
  function renderDonutChart(positive, negative, neutral, size) {
    // 兼容0-100整数和0-1小数两种输入
    if (positive > 1 || negative > 1 || neutral > 1) {
      positive = positive / 100; negative = negative / 100; neutral = neutral / 100;
    }
    size = size || 140;
    var cx = size / 2;
    var cy = size / 2;
    var outerR = size / 2 - 4;
    var innerR = outerR * 0.62;
    var C = 2 * Math.PI * outerR;

    var segments = [
      { value: positive, color: '#047857' },
      { value: neutral, color: '#94a3b8' },
      { value: negative, color: '#B91C1C' }
    ];

    var svg = '<svg class="dr-donut-chart" viewBox="0 0 ' + size + ' ' + size + '">';

    // Background ring
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + outerR + '" fill="none" stroke="#f1f5f9" stroke-width="' + (outerR - innerR) + '"/>';

    // Segments
    var offset = 0;
    segments.forEach(function(seg) {
      if (seg.value <= 0) return;
      var dashLen = C * seg.value;
      var dashOffset = C * offset;
      svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + outerR + '" fill="none" stroke="' + seg.color + '" stroke-width="' + (outerR - innerR) + '" stroke-dasharray="' + dashLen.toFixed(2) + ' ' + (C - dashLen).toFixed(2) + '" stroke-dashoffset="' + (-dashOffset).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
      offset += seg.value;
    });

    // Center text
    var mainPct = Math.round(positive * 100);
    svg += '<text class="dr-donut-chart__center-text" x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" dominant-baseline="central">' + Math.min(mainPct, 100) + '%</text>';
    svg += '<text class="dr-donut-chart__center-label" x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle">正面</text>';

    svg += '</svg>';
    return svg;
  }

  /**
   * 生成水平柱状图SVG
   * @param {Array} items - [{name, value, color}]
   * @param {number} width - SVG宽度
   * @param {number} barHeight - 柱高
   * @returns {string} SVG HTML字符串
   */
  function renderHBarChart(items, width, barHeight) {
    width = width || 520;
    barHeight = barHeight || 28;
    var gap = 12;
    var labelW = 80;
    var valueW = 40;
    var chartW = width - labelW - valueW - 16;
    var h = items.length * (barHeight + gap) - gap + 8;
    var maxVal = 0;
    items.forEach(function(it) { if (it.value > maxVal) maxVal = it.value; });
    if (maxVal === 0) maxVal = 100;

    var svg = '<svg class="dr-hbar-chart" viewBox="0 0 ' + width + ' ' + h + '">';

    items.forEach(function(it, idx) {
      var y = idx * (barHeight + gap) + 4;
      var barW = Math.max(2, chartW * (it.value / maxVal));

      // Label
      svg += '<text class="dr-hbar-chart__label" x="' + (labelW - 8) + '" y="' + (y + barHeight / 2 + 4) + '" text-anchor="end">' + esc(it.name) + '</text>';

      // Bar background
      svg += '<rect class="dr-hbar-chart__bar-bg" x="' + labelW + '" y="' + y + '" width="' + chartW + '" height="' + barHeight + '" rx="4"/>';

      // Bar fill
      svg += '<rect class="dr-hbar-chart__bar-fill" x="' + labelW + '" y="' + y + '" width="' + barW + '" height="' + barHeight + '" fill="' + it.color + '"/>';

      // Value
      svg += '<text class="dr-hbar-chart__value" x="' + (labelW + chartW + 8) + '" y="' + (y + barHeight / 2 + 4) + '">' + it.value + '</text>';
    });

    svg += '</svg>';
    return svg;
  }

  // ===== Trend Line Chart (rates 0-1) =====
  function renderTrendChart(opts) {
    var dates = opts.dates || [];
    var series = opts.series || [];
    var W = 680, H = opts.height || 240;
    var padL = 46, padR = 16, padT = 18, padB = 34;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var yMax = opts.yMax || 1;
    function xAt(i) { return padL + (dates.length <= 1 ? plotW / 2 : plotW * i / (dates.length - 1)); }
    function yAt(v) { return padT + plotH * (1 - Math.min(1, Math.max(0, v / yMax))); }
    var svg = '<svg class="dr-trend-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
    for (var g = 0; g <= 4; g++) {
      var gy = padT + plotH * g / 4;
      var gv = yMax * (1 - g / 4);
      svg += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '" class="dr-trend-chart__grid"/>';
      svg += '<text x="' + (padL - 8) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" class="dr-trend-chart__ylabel">' + (gv * 100).toFixed(0) + '%</text>';
    }
    if (dates.length) {
      var xticks = [0, Math.floor((dates.length - 1) / 2), dates.length - 1];
      var seen = {};
      xticks.forEach(function(i) {
        if (i < 0 || i >= dates.length || seen[i]) return;
        seen[i] = 1;
        svg += '<text x="' + xAt(i).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" class="dr-trend-chart__xlabel">' + esc(String(dates[i] || '').substring(5)) + '</text>';
      });
    }
    series.forEach(function(se) {
      if (!se.data || !se.data.length) return;
      var pts = [];
      se.data.forEach(function(v, i) { pts.push(xAt(i).toFixed(1) + ',' + yAt(v).toFixed(1)); });
      svg += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + se.color + '" stroke-width="2.2" stroke-linejoin="round"/>';
      var li = se.data.length - 1;
      svg += '<circle cx="' + xAt(li).toFixed(1) + '" cy="' + yAt(se.data[li]).toFixed(1) + '" r="3.5" fill="' + se.color + '"/>';
    });
    svg += '</svg>';
    var leg = '<div class="dr-trend-chart__legend">';
    series.forEach(function(se) {
      leg += '<span class="dr-trend-chart__legend-item"><span class="dr-trend-chart__legend-dot" style="background:' + se.color + '"></span>' + esc(se.name) + '</span>';
    });
    leg += '</div>';
    return '<div class="dr-trend-chart__wrap">' + svg + leg + '</div>';
  }

  // ===== 06 AI Search（证据优先布局）=====
  function renderAiSearch(d) {
    var ais = (d.stages || {}).AI_SEARCH || {};
    if (ais.realMetrics && ais.realMetrics.brandRefRate != null) {
      return renderAiSearchReal(d, ais);
    }
    if (ais.sources || ais.basis) {
      return renderAiSearchEvidence(d, ais);
    }
    // 既无 Mentis 真实数据、也无信源证据 —— 如实说明，不做任何模拟
    var h = '<section id="section-search" class="dr-section"><div class="dr-section__header">' +
      '<div class="dr-section__num">06</div><div class="dr-section__title-group"><h2 class="dr-section__title">AI 可引用内容覆盖</h2>' +
      '<p class="dr-section__subtitle">五类信源覆盖情况 · 本报告未实测 AI 输出</p></div></div>';

    h += '<div class="dr-scope-note">&#9888; 本次检索未采集到可核验的信源证据条目，本维度不计分。' +
      '本报告不对 AI 平台的输出做任何推算或模拟——若某条结论没有可点开的原始页面，它就不会出现在本报告里。' +
      '建议优先补齐百科词条、权威媒体报道与行业报告等信源内容，使品牌在 AI 检索中具备可被引用的素材。</div>';

  // ===== 06b 证据优先布局（五类信源覆盖 + 逐条证据）=====

    var total = sources.reduce(function (a, s) { return a + (s.evidence || []).length; }, 0);

    var h = '<section id="section-search" class="dr-section"><div class="dr-section__header">' +
      '<div class="dr-section__num">06</div><div class="dr-section__title-group"><h2 class="dr-section__title">AI 可引用内容覆盖</h2>' +
      '<p class="dr-section__subtitle">五类信源覆盖情况 · 本报告未实测 AI 输出</p></div></div>';

    h += '<div class="dr-scope-note">&#9888; 本章不含对 AI 平台输出的实测。下列条目是「某信源上是否存在可被 AI 引用的品牌内容」的可核验记录，每条附 URL 与日期。</div>';

    h += '<div class="stage-ais__stats">' +
      '<div class="stage-ais__stat-card stage-ais__stat-card--primary"><div class="stage-ais__stat-value">' + (dimScore == null ? '—' : dimScore) + '</div><div class="stage-ais__stat-label">覆盖维度得分</div></div>' +
      '<div class="stage-ais__stat-card"><div class="stage-ais__stat-value">' + covered + ' / ' + sources.length + '</div><div class="stage-ais__stat-label">有证据的信源类型</div></div>' +
      '<div class="stage-ais__stat-card"><div class="stage-ais__stat-value">' + total + '</div><div class="stage-ais__stat-label">证据条目</div></div></div>';

    if (basis) {
      h += '<div class="stage-overview__summary"><div class="stage-overview__summary-icon">&#128203;</div><div class="stage-overview__summary-text">' + esc(basis) + '</div></div>';
    }

    if (sources.length) {
      h += '<div class="stage-ais__section"><div class="stage-ais__section-title">信源覆盖</div><div class="stage-ais__platform-grid">';
      sources.forEach(function (s) {
        var n = (s.evidence || []).length;
        h += '<div class="stage-ais__platform-card ' + (n ? 'stage-ais__platform-card--ev' : 'stage-ais__platform-card--ev-empty') + '">' +
          '<div class="stage-ais__platform-header"><span class="stage-ais__platform-name">' + esc(s.name || s.type || '') + '</span>' +

          '<div class="stage-ais__platform-metrics"><span>' + esc(s.type || '') + '</span></div>' +
          (s.note ? '<div class="stage-ais__platform-metrics" style="margin-top:6px;"><span>' + esc(s.note) + '</span></div>' : '') +
          '</div>';
      });
      h += '</div></div>';
    }

    h += '</section>';
    return h;
  }

  // ===== 04b AI Search (Mentis real data) =====
  function renderAiSearchReal(d, ais) {
    var rm = ais.realMetrics || {};
    var covered = ais.coveredModels || [];
    var dateRange = ais.dateRange || '';
    var qsets = ais.querySets || [];
    var trend = rm.trend || [];

    var h = '<section id="section-search" class="dr-section"><div class="dr-section__header">' +
      '<div class="dr-section__num">06</div><div class="dr-section__title-group"><h2 class="dr-section__title">AI 可引用内容覆盖</h2>' +
      '<p class="dr-section__subtitle">Mentis 真实品牌数据</p></div></div>';

    h += '<div class="dr-real-badge">📊 数据来源：Mentis 系统 · 品牌数据' + (dateRange ? '（' + esc(dateRange) + '）' : '') + '</div>';

    function statCard(value, label, color) {
      return '<div class="stage-ais__stat-card"><div class="stage-ais__stat-value"' + (color ? ' style="color:' + color + ';"' : '') + '>' + value + '</div><div class="stage-ais__stat-label">' + label + '</div></div>';
    }
    h += '<div class="stage-ais__stats">' +
      statCard(fmtRate(rm.brandRefRate || 0) + '%', '品牌引用率', getMentionColor(rm.brandRefRate || 0)) +
      statCard(fmtRate(rm.showRate || 0) + '%', '展示率', getMentionColor(rm.showRate || 0)) +
      statCard((rm.showTGI != null ? (rm.showTGI).toFixed(2) : '-'), '展示TGI(相对行业)', (rm.showTGI || 0) >= 1 ? '#047857' : '#B45309') +
      statCard(fmtRate(rm.showRefRate || 0) + '%', '展示引用率', '') +
      statCard((rm.refNum != null ? rm.refNum.toLocaleString() : '-'), '引用次数', '') +
      statCard((rm.showCount != null ? rm.showCount.toLocaleString() : '-'), '展示次数', '') +
      '</div>';

    if (covered.length) {
      h += '<div class="dr-chips"><span class="dr-chips__label">覆盖 AI 模型：</span>' + covered.map(function(m) { return '<span class="dr-chip">' + esc(m) + '</span>'; }).join('') + '</div>';
    }

    if (qsets.length) {
      h += '<div class="stage-ais__section"><div class="stage-ais__section-title">不同查询集品牌引用率对比</div><div class="stage-ais__qset-grid">';

      });

        { name: '品牌引用率', color: '#13BE93', data: trend.map(function(t) { return t.brandRefRate || 0; }) },
        { name: '展示率', color: '#4F46E5', data: trend.map(function(t) { return t.showRate || 0; }) },
        { name: 'TOP1占比', color: '#B45309', data: trend.map(function(t) { return t.top1Rate || 0; }) }
      ];
      h += '<div class="stage-ais__section"><div class="stage-ais__section-title">品牌引用率趋势（分日）</div>' + renderTrendChart({ dates: dates, series: series, yMax: 1 }) + '</div>';
